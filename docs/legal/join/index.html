<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cestou — Convite para lista de compras</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5f5f5f;
    --accent: #2e7d32;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f2f2f2;
      --muted: #b0b0b0;
      --accent: #81c784;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    margin: 12px 0;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    font-size: 1rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  .token {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--border);
    padding: 2px 8px;
    border-radius: 6px;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
  a { color: var(--accent); }
  #no-token { display: none; }
</style>
</head>
<body>
<main>
  <h1>Você foi convidado para uma lista no Cestou</h1>
  <p class="subtitle" id="with-token">
    Abra o convite <span class="token" id="token-display"></span> no app para entrar na lista.
  </p>
  <p class="subtitle" id="no-token">Esse link de convite parece estar incompleto ou já expirou.</p>

  <a id="open-app" class="btn btn-primary" href="#">Abrir no app Cestou</a>
  <a id="get-app" class="btn btn-secondary"
     href="https://play.google.com/store/apps/details?id=br.com.brunocarvalhs.howmuch">
    Não tenho o app — baixar na Play Store
  </a>

  <footer>
    Cestou &middot; <a href="../privacy.html">Privacidade</a> &middot; <a href="../terms.html">Termos de Uso</a>
  </footer>
</main>
<script>
  (function () {
    var PACKAGE = "br.com.brunocarvalhs.howmuch";
    var parts = location.pathname.split("/").filter(Boolean); // ["join", "<token>"]
    var token = parts[1] || new URLSearchParams(location.search).get("token");

    if (token) {
      document.getElementById("token-display").textContent = token;
    } else {
      document.getElementById("with-token").style.display = "none";
      document.getElementById("no-token").style.display = "block";
    }

    var joinPath = token ? "/join/" + encodeURIComponent(token) : "/join";
    var httpsUrl = location.origin + joinPath;
    var fallback = encodeURIComponent(
      "https://play.google.com/store/apps/details?id=" + PACKAGE
    );
    var intentUrl =
      "intent://" + location.host + joinPath +
      "#Intent;scheme=https;package=" + PACKAGE +
      ";S.browser_fallback_url=" + fallback + ";end";

    var openAppLink = document.getElementById("open-app");
    var isAndroid = /Android/i.test(navigator.userAgent);
    openAppLink.href = isAndroid ? intentUrl : httpsUrl;

    // If the App Link wasn't verified yet, Android drops the user here instead of
    // intercepting the https link - try the explicit intent automatically once.
    if (isAndroid && token) {
      location.href = intentUrl;
    }
  })();
</script>
</body>
</html>
