# CI/CD Centralized Configuration
# This file is the source of truth for all pipeline behaviors.

project:
  name: "HowMuch"
  display_name: "HowMuch"
  package_name: "br.com.brunocarvalhs.howmuch"

# Git bot configuration for automated commits
git:
  bot_name: "github-actions[bot]"
  bot_email: "41898282+github-actions[bot]@users.noreply.github.com"
  branches:
    main: "master"
    develop: "develop"

# File paths used across the pipeline
paths:
  gradle_file: "app/build.gradle.kts"
  changelog: "CHANGELOG.md"
  keystore: "app/release.keystore"
  apk_debug: "app/build/outputs/apk/debug/*.apk"
  apk_release: "app/build/outputs/apk/release/*.apk"
  aab_release: "app/build/outputs/bundle/release/*.aab"

# Global Build Settings
build:
  java-distribution: "temurin"
  java-version: "17"
  gradle-version: "8.3.1"
  gradle_opts: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"
  ignore-cache: false
  
  # Build targets: one entry per distributable app module (phone, Wear OS, Android
  # Auto, ...). Onboarding a new device only means adding a target here with its
  # own module path and variants - no workflow file changes are required. Each
  # variant may set deploy.firebase.app_id explicitly (needed once a target has
  # its own Firebase App entry, e.g. Wear OS); when omitted, the pipeline falls
  # back to the shared FIREBASE_APP_ID secret.
  targets:
    - name: "app"
      module: ":app"
      description: "Phone / Tablet app"
      google_services_required: true
      variants:
        - name: "debug"
          description: "Development / Internal Testing"
          gradle_task: "assembleDebug"
          enabled: true
          path: "app/build/outputs/apk/debug/*.apk"
          artifact_name: "HowMuch-app-debug"
          deploy:
            firebase:
              label: "APP DEBUG"

        - name: "release"
          description: "Production Ready APK"
          gradle_task: "assembleRelease"
          enabled: true
          path: "app/build/outputs/apk/release/*.apk"
          artifact_name: "HowMuch-app-release"
          deploy:
            firebase:
              label: "APP RELEASE"

    - name: "wear"
      module: ":wear"
      description: "Wear OS companion app"
      google_services_required: true
      variants:
        - name: "debug"
          description: "Development / Internal Testing"
          gradle_task: "assembleDebug"
          enabled: true
          path: "wear/build/outputs/apk/debug/*.apk"
          artifact_name: "HowMuch-wear-debug"
          deploy:
            firebase:
              label: "WEAR DEBUG"
              app_id: "1:801865394084:android:3d8cd6308873dd4789c331"

        - name: "release"
          description: "Production Ready APK"
          gradle_task: "assembleRelease"
          enabled: true
          path: "wear/build/outputs/apk/release/*.apk"
          artifact_name: "HowMuch-wear-release"
          deploy:
            firebase:
              label: "WEAR RELEASE"
              app_id: "1:801865394084:android:3d8cd6308873dd4789c331"

# Checks run by every pipeline (PR validation, develop build, master release).
# Adding, removing, renaming or disabling a check is a pure config change here -
# no workflow file edits needed. `pr_comment` is optional; when set, tests.yml
# posts it on the PR (build.yml/release.yml never run on a pull_request event,
# so they simply skip commenting).
#
# `stage` controls execution order: every check in stage 1 runs in parallel
# first; stage 2 only starts once every enabled stage-1 check has passed. Two
# stages is what the workflows wire up today - group checks accordingly (e.g.
# keep fast static analysis in stage 1 to fail fast before the slower stage).
checks:
  - name: "lint"
    display_name: "🧹 Code Style (Lint)"
    enabled: true
    stage: 1
    command: "./gradlew lintDebug"
    pr_comment:
      success: "✅ Todos os lints passaram com sucesso! Bom trabalho."
      failure: "❌ Ops, encontrado falhas no lint, por favor corrija."

  - name: "detekt"
    display_name: "🔍 Static Analysis (Detekt)"
    enabled: true
    stage: 1
    command: "./gradlew detekt"
    pr_comment:
      success: "✅ Todos os detekts passaram com sucesso! Bom trabalho."
      failure: "❌ Ops, encontrado falhas no detekt, por favor corrija."

  - name: "unit_tests"
    display_name: "🧪 Unit Testing"
    enabled: true
    stage: 2
    command: "./gradlew testDebug"
    pr_comment:
      success: "✅ Todos os testes unitários passaram com sucesso! Bom trabalho."
      failure: "❌ Ops, encontrado falhas nos testes unitários, por favor corrija."

# Test Coverage Gate (kept separate from checks[]: it depends on unit_tests
# having run first, and it publishes an HTML report artifact).
coverage:
  kover:
    name: "Kover"
    display_name: "📊 Test Coverage Gate (min. 80%)"
    description: "Minimum aggregated line coverage gate (80%), enforced via kover { reports { total { verify { rule { minBound(80) } } } } } in the root build.gradle.kts"
    enabled: true
    command: "./gradlew koverVerify"
    report_path: "build/reports/kover/html/index.html"
    pr_comment:
      success: "✅ Cobertura de testes acima de 80%! Bom trabalho."
      failure: "❌ A cobertura de testes ficou abaixo do mínimo de 80%, por favor complemente os testes."

# Store & GitHub Release Settings
release:
  enabled: true
  command_aab: "./gradlew bundleRelease"
  # Toggles .github/scripts/version.sh (bumps versionName/versionCode, updates
  # CHANGELOG.md and creates the GitHub Release). Disable to build/deploy a
  # master push without cutting a new version, e.g. re-running a failed deploy.
  versioning:
    enabled: true
  firebase:
    enabled: true
    groups: "testers"
    notifications: false
  github_release:
    draft: false
    prerelease: false
  google_play:
    track: "production"
    status: "completed"
    user_fraction: 0.5

# Danger JS Rules and Settings
danger:
  enabled: true
  node_version: 24
  rules:
    pr_size_limit: 500
    jira_pattern: "\\[?[A-Z]{2,}-\\d+\\]?"
    naming:
      resource_prefixes:
        'feature:products': 'feature_products_'
        'feature:shopping': 'feature_shopping_'
        'feature:settings': 'feature_settings_'
      suffixes:
        ViewModel: 'ViewModel'
        Repository: 'Repository'
        RepositoryImpl: 'RepositoryImpl'
    architecture:
      rules:
        feature: ['core', 'domain']
        core: ['core', 'domain']
        domain: ['domain']
        data: ['domain', 'core']
