# Configuration for GitHub Actions Pipeline

project:
  name: "HowMuch"
  package_name: "br.com.brunocarvalhs.howmuch"

git:
  bot_name: "github-actions[bot]"
  bot_email: "41898282+github-actions[bot]@users.noreply.github.com"
  branches:
    main: "master"
    develop: "develop"

paths:
  gradle_file: "app/build.gradle.kts"
  changelog: "CHANGELOG.md"
  keystore: "app/release.keystore"
  apk_debug: "app/build/outputs/apk/debug/*.apk"
  apk_release: "app/build/outputs/apk/release/*.apk"
  aab_release: "app/build/outputs/bundle/release/*.aab"

build:
  java-distribution: "temurin"
  java-version: "17"
  gradle-version: "8.3.1"
  gradle_opts: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"
  ignore-cache: false
  flavors:
    - name: "debug"
      gradle_task: "assembleDebug"
      enabled: true
      path: "app/build/outputs/apk/debug/*.apk"
      artifact_name: "FriendsSecrets-apk-debug"
      deploy:
        firebase:
          label: "DEBUG"
          app_id: "1:1234567890:android:abcdef123456"
    - name: "release"
      gradle_task: "assembleRelease"
      enabled: true
      path: "app/build/outputs/apk/release/*.apk"
      artifact_name: "FriendsSecrets-apk-release"
      deploy:
        firebase:
          label: "RELEASE"
          app_id: "1:1234567890:android:abcdef123456"

test:
  - name: "unit_tests"
    enabled: true
    command: "./gradlew testDebug"
    path: 
      - "app/build/reports/tests/testDebugUnitTest/index.html"
    gradlew-path: "."
    build-path: "app/build/reports/tests/testDebugUnitTest/index.html"
    reporter-type: "html"
    reporter-path: "app/build/reports/tests/testDebugUnitTest/index.html"

linters:
  lint:
    enabled: true
    command: "./gradlew lintDebug"
  detekt:
    enabled: true
    command: "./gradlew detekt"

release:
  enabled: true
  command_aab: "./gradlew bundleRelease"
  github_release:
    draft: false
    prerelease: false
  google_play:
    track: "production"
    status: "completed"
    user_fraction: 0.5

danger:
  enabled: true
  node_version: 24
