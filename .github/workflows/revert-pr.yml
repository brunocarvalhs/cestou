name: Revert Pull Request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR a ser revertido"
        required: true
        type: number

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Config
        id: config
        run: |
          echo "target_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_name=$(yq '.git.bot_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_email=$(yq '.git.bot_email' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Configurar Git
        run: |
          git config user.name "${{ steps.config.outputs.bot_name }}"
          git config user.email "${{ steps.config.outputs.bot_email }}"

      - name: Buscar PR
        id: pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.TOKEN }}
          pull_request_number: ${{ github.event.inputs.pr_number }}

      - name: Criar branch de revert
        run: |
          BRANCH="revert-pr-${{ github.event.inputs.pr_number }}"
          git checkout -b $BRANCH
          git revert -m 1 ${{ steps.pr.outputs.merge_commit_sha }} || true
          git push origin $BRANCH
          echo "branch_name=$BRANCH" >> $GITHUB_ENV

      - name: Criar PR de revert
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TOKEN }}
          branch: ${{ env.branch_name }}
          base: ${{ steps.config.outputs.target_branch }}
          title: "Revert PR #${{ github.event.inputs.pr_number }}"
          body: "Este PR reverte as mudanças do PR #${{ github.event.inputs.pr_number }}"
