name: Automation - Code Analysis (Danger)

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Config
        id: config
        run: |
          echo "enabled=$(yq '.danger.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "node_version=$(yq '.danger.node_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          # Export YAML to JSON for Danger scripts to read
          yq -o=json . .github/pipeline-config.yaml > .github/pipeline-config.json

      - name: Set up Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node_version }}

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install -g danger conventional-changelog

      - name: Run Danger
        if: steps.config.outputs.enabled == 'true'
        run: danger ci --dangerfile .github/danger/dangerfile.js
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Install GitHub CLI
        if: steps.config.outputs.enabled == 'true'
        run: sudo apt-get install gh

      - name: Approve PR
        if: steps.config.outputs.enabled == 'true' && success() && !failure()
        run: |
          if [[ "${{ github.actor }}" == "${{ github.event.pull_request.user.login }}" ]]; then
            echo "Self-approval is not allowed. Please ask a reviewer to approve."
          else
            echo "Automatic PR approval"
            gh pr review "${{ github.event.pull_request.number }}" --approve --body "Approved automatically by CI."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
