name: Continuous Integration - Store Release

on:
  push:
    branches: [ master ]

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      java_distribution: ${{ steps.config.outputs.java_distribution }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      app_name: ${{ steps.config.outputs.app_name }}
      package_name: ${{ steps.config.outputs.package_name }}
      aab_pattern: ${{ steps.config.outputs.aab_pattern }}
      keystore_path: ${{ steps.config.outputs.keystore_path }}
      ut_enabled: ${{ steps.config.outputs.ut_enabled }}
      lint_enabled: ${{ steps.config.outputs.lint_enabled }}
      detekt_enabled: ${{ steps.config.outputs.detekt_enabled }}
      release_enabled: ${{ steps.config.outputs.release_enabled }}
      github_draft: ${{ steps.config.outputs.github_draft }}
      github_prerelease: ${{ steps.config.outputs.github_prerelease }}
      play_track: ${{ steps.config.outputs.play_track }}
      play_status: ${{ steps.config.outputs.play_status }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "jdk_version=$(yq '.build.\"java-version\"' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "java_distribution=$(yq '.build.\"java-distribution\" // \"temurin\"' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.build.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "app_name=$(yq '.project.name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "package_name=$(yq '.project.package_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "aab_pattern=$(yq '.paths.aab_release' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "keystore_path=$(yq '.paths.keystore' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "ut_enabled=$(yq '.test[] | select(.name == \"unit_tests\") | .enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "lint_enabled=$(yq '.linters.lint.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "detekt_enabled=$(yq '.linters.detekt.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "release_enabled=$(yq '.release.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "github_draft=$(yq '.release.github_release.draft' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "github_prerelease=$(yq '.release.github_release.prerelease' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "play_track=$(yq '.release.google_play.track' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "play_status=$(yq '.release.google_play.status' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

  unit-tests:
    needs: [prepare]
    if: needs.prepare.outputs.ut_enabled == 'true'
    runs-on: ubuntu-24.04
    name: 🧪 Unit Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Run Unit Tests
        run: |
          COMMAND=$(yq '.test[] | select(.name == \"unit_tests\") | .command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  lint-check:
    needs: [prepare]
    if: needs.prepare.outputs.lint_enabled == 'true'
    runs-on: ubuntu-24.04
    name: 🧹 Code Style (Lint)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Run Lint
        run: |
          COMMAND=$(yq '.linters.lint.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  detekt-check:
    needs: [prepare]
    if: needs.prepare.outputs.detekt_enabled == 'true'
    runs-on: ubuntu-24.04
    name: 🔍 Static Analysis (Detekt)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Run Detekt
        run: |
          COMMAND=$(yq '.linters.detekt.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  build:
    needs: [prepare, unit-tests, lint-check, detekt-check]
    if: needs.prepare.outputs.release_enabled == 'true'
    runs-on: ubuntu-24.04
    name: 📦 Build Bundle (AAB)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Build AAB
        run: |
          COMMAND=$(yq '.release.command_aab' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-aab
          path: ${{ needs.prepare.outputs.aab_pattern }}

  release:
    runs-on: ubuntu-24.04
    name: 🏷️ GitHub Release & Versioning
    needs: [prepare, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          BOT_NAME=$(yq '.git.bot_name' .github/pipeline-config.yaml)
          BOT_EMAIL=$(yq '.git.bot_email' .github/pipeline-config.yaml)
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"

      - name: Run versioning script
        id: versioning
        run: |
          chmod +x .github/scripts/version.sh
          new_version=$(.github/scripts/version.sh)
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          GRADLE_FILE=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)
          CHANGELOG_FILE=$(yq '.paths.changelog' .github/pipeline-config.yaml)
          if [ -n "${{ steps.versioning.outputs.new_version }}" ]; then
            git add $GRADLE_FILE $CHANGELOG_FILE
            git commit -m "chore(release): Prepare release ${{ steps.versioning.outputs.new_version }}"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: steps.versioning.outputs.new_version != ''
        with:
          tag_name: ${{ steps.versioning.outputs.new_version }}
          name: v${{ steps.versioning.outputs.new_version }}
          draft: ${{ needs.prepare.outputs.github_draft }}
          prerelease: ${{ needs.prepare.outputs.github_prerelease }}
          token: ${{ secrets.TOKEN }}

  deploy:
    runs-on: ubuntu-24.04
    name: 🏁 Google Play Deployment
    needs: [prepare, release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-aab
          path: output/

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.prepare.outputs.package_name }}
          releaseFiles: output/**/*.aab
          track: ${{ needs.prepare.outputs.play_track }}
          status: ${{ needs.prepare.outputs.play_status }}
