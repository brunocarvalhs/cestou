name: Build and Release Application

on:
  push:
    branches: [ master ]

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      app_name: ${{ steps.config.outputs.app_name }}
      package_name: ${{ steps.config.outputs.package_name }}
      aab_path: ${{ steps.config.outputs.aab_path }}
      keystore_path: ${{ steps.config.outputs.keystore_path }}
      ut_enabled: ${{ steps.config.outputs.ut_enabled }}
      lint_enabled: ${{ steps.config.outputs.lint_enabled }}
      detekt_enabled: ${{ steps.config.outputs.detekt_enabled }}
      release_enabled: ${{ steps.config.outputs.release_enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "jdk_version=$(yq '.project.jdk_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.project.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "app_name=$(yq '.project.name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "package_name=$(yq '.project.package_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "aab_path=$(yq '.paths.aab_release' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "keystore_path=$(yq '.paths.keystore' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "ut_enabled=$(yq '.stages.unit_tests.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "lint_enabled=$(yq '.stages.lint.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "detekt_enabled=$(yq '.stages.detekt.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "release_enabled=$(yq '.stages.release.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

  checkout-and-setup:
    needs: prepare
    runs-on: ubuntu-24.04
    name: Checkout and Setup Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-release
          path: ./

  unit-tests:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.ut_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Unit Tests
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Run Unit Tests
        run: |
          COMMAND=$(yq '.stages.unit_tests.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  lint-check:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.lint_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Lint Check
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Run Lint
        run: |
          COMMAND=$(yq '.stages.lint.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  detekt-check:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.detekt_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Run Detekt Check
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Run Detekt
        run: |
          COMMAND=$(yq '.stages.detekt.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  build:
    needs: [prepare, unit-tests, lint-check, detekt-check]
    if: needs.prepare.outputs.release_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Build AAB
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Build AAB
        run: |
          COMMAND=$(yq '.stages.release.command_aab' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-aab
          path: ${{ needs.prepare.outputs.aab_path }}

  release:
    runs-on: ubuntu-24.04
    name: Create and Upload Release
    needs: [prepare, build]
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Setup Git
        run: |
          BOT_NAME=$(yq '.git.bot_name' .github/pipeline-config.yaml)
          BOT_EMAIL=$(yq '.git.bot_email' .github/pipeline-config.yaml)
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"

      - name: Run versioning script
        id: versioning
        run: |
          chmod +x .github/scripts/version.sh
          new_version=$(.github/scripts/version.sh)
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          GRADLE_FILE=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)
          CHANGELOG_FILE=$(yq '.paths.changelog' .github/pipeline-config.yaml)
          if [ -n "${{ steps.versioning.outputs.new_version }}" ]; then
            git add $GRADLE_FILE $CHANGELOG_FILE
            git commit -m "chore(release): Prepare release ${{ steps.versioning.outputs.new_version }}"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: steps.versioning.outputs.new_version != ''
        with:
          tag_name: ${{ steps.versioning.outputs.new_version }}
          name: v${{ steps.versioning.outputs.new_version }}
          draft: false
          prerelease: false
          token: ${{ secrets.TOKEN }}

  deploy:
    runs-on: ubuntu-24.04
    name: Deploy to Google Play
    needs: [prepare, release]
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-release

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-aab
          path: app/build/outputs/bundle/release/

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.prepare.outputs.package_name }}
          releaseFiles: ${{ needs.prepare.outputs.aab_path }}
          track: production
          status: completed
