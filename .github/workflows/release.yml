name: Continuous Integration - Store Release

# Thin caller for brunocarvalhs/mobile-ci-pipeline. The actual logic lives
# there - edit .github/pipeline-config.yaml to change what runs. Bump the
# pinned @v1 below to pick up pipeline improvements after reviewing the
# changelog at https://github.com/brunocarvalhs/mobile-ci-pipeline.

on:
  push:
    branches: [ master ]

jobs:
  checks:
    uses: brunocarvalhs/mobile-ci-pipeline/.github/workflows/checks.yml@v1
    secrets: inherit

  store-release:
    needs: [checks]
    uses: brunocarvalhs/mobile-ci-pipeline/.github/workflows/store-release.yml@v1
    secrets: inherit
