name: Android Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      ut_enabled: ${{ steps.config.outputs.ut_enabled }}
      lint_enabled: ${{ steps.config.outputs.lint_enabled }}
      detekt_enabled: ${{ steps.config.outputs.detekt_enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "jdk_version=$(yq '.project.jdk_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.project.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "ut_enabled=$(yq '.stages.unit_tests.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "lint_enabled=$(yq '.stages.lint.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "detekt_enabled=$(yq '.stages.detekt.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

  checkout-and-setup:
    needs: prepare
    runs-on: ubuntu-24.04
    name: Checkout and Setup Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-tests
          path: ./

  unit-tests:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.ut_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Run Unit Tests
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-tests

      - name: Run Unit Tests
        run: |
          COMMAND=$(yq '.stages.unit_tests.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

      - name: Comment Failure
        if: ${{ failure() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "❌ Ops, encontrado falhas nos testes unitários, por favor corrija."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "-1 | confused"

      - name: Comment Success
        if: ${{ success() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "✅ Todos os testes unitários passaram com sucesso! Bom trabalho."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "+1"

  lint-check:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.lint_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Run Lint Check
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-tests

      - name: Run Lint
        run: |
          COMMAND=$(yq '.stages.lint.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

      - name: Comment Failure
        if: ${{ failure() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "❌ Ops, encontrado falhas no lint, por favor corrija."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "-1 | confused"

      - name: Comment Success
        if: ${{ success() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "✅ Todos os lints passaram com sucesso! Bom trabalho."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "+1"

  detekt-check:
    needs: [prepare, checkout-and-setup]
    if: needs.prepare.outputs.detekt_enabled == 'true'
    runs-on: ubuntu-24.04
    name: Run Detekt Check
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-tests

      - name: Run Detekt
        run: |
          COMMAND=$(yq '.stages.detekt.command' .github/pipeline-config.yaml)
          chmod +x gradlew
          $COMMAND
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

      - name: Comment Failure
        if: ${{ failure() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "❌ Ops, encontrado falhas no detekt, por favor corrija."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "-1 | confused"

      - name: Comment Success
        if: ${{ success() }}
        uses: mb2dev/github-action-comment-pull-request@1.0.0
        with:
          message: "✅ Todos os detekts passaram com sucesso! Bom trabalho."
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          reactions: "+1"
