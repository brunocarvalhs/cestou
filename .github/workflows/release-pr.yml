name: Release - Prepare Release PR

# Git Flow "promote to master": keeps an open PR develop → master whenever
# develop has commits that master does not. Runs on every push to develop and
# on demand. The version is NOT bumped here: release.yml bumps versionName +
# versionCode on the merge into master. This workflow only reads the current
# versionName (app/build.gradle.kts) to name the PR.
#
# Merge the PR as a MERGE COMMIT (squash is blocked on master by ruleset).

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    name: Open Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout develop
        uses: actions/checkout@v7

      - name: Load Config
        id: config
        run: |
          echo "main_branch=$(yq '.git.branches.main' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "dev_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_file=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Check develop ahead of master
        id: ahead
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          MAIN="${{ steps.config.outputs.main_branch }}"
          DEV="${{ steps.config.outputs.dev_branch }}"
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/$MAIN...$DEV" --jq .ahead_by)
          echo "ahead_by=$AHEAD" >> $GITHUB_OUTPUT
          if [ "$AHEAD" -eq 0 ]; then
            echo "::notice::$DEV não tem commits à frente de $MAIN - nada para promover."
          fi

      - name: Read versionName
        id: version
        if: steps.ahead.outputs.ahead_by != '0'
        run: |
          VERSION=$(grep -m1 'versionName = ' "${{ steps.config.outputs.gradle_file }}" | sed 's/.*versionName = "\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::versionName não encontrado em ${{ steps.config.outputs.gradle_file }}"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Open PR (if none open)
        if: steps.ahead.outputs.ahead_by != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          MAIN="${{ steps.config.outputs.main_branch }}"
          DEV="${{ steps.config.outputs.dev_branch }}"
          VERSION="${{ steps.version.outputs.version }}"

          EXISTING=$(gh pr list --head "$DEV" --base "$MAIN" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::Já existe um PR aberto de $DEV → $MAIN, reaproveitando."
            exit 0
          fi

          gh pr create \
            --title "Release $VERSION" \
            --body "Promove \`$DEV\` para \`$MAIN\`. Versão: **$VERSION**. Fazer o merge como **merge commit** (squash bloqueado na \`$MAIN\`). O merge dispara \`release.yml\`." \
            --base "$MAIN" \
            --head "$DEV" \
            --label "release"
