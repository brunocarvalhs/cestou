name: Release - Prepare Release PR

# Git Flow "promote to master" step: opens a PR straight from develop into
# master - no intermediate release branch. The version is NOT bumped here:
# release.yml bumps versionName + versionCode together on the merge into
# master. version.sh only runs here as a dry run, to put the upcoming version
# in the PR title (and to skip opening a PR with nothing releasable).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Bump & Open Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load Config
        id: config
        run: |
          echo "main_branch=$(yq '.git.branches.main' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "dev_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_preview_version=$(yq '.release.step_names.preview_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_open_pr=$(yq '.release.step_names.open_pr' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_noop=$(yq '.release.step_names.noop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: ${{ steps.config.outputs.step_preview_version }}
        id: bump
        run: |
          chmod +x .github/scripts/version.sh
          new_version=$(.github/scripts/version.sh)
          git checkout -- .
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: ${{ steps.config.outputs.step_open_pr }}
        if: steps.bump.outputs.new_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          MAIN_BRANCH="${{ steps.config.outputs.main_branch }}"
          DEV_BRANCH="${{ steps.config.outputs.dev_branch }}"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          EXISTING=$(gh pr list --head "$DEV_BRANCH" --base "$MAIN_BRANCH" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::Já existe um PR aberto de $DEV_BRANCH → $MAIN_BRANCH, reaproveitando."
            exit 0
          fi

          gh pr create \
            --title "Release $NEW_VERSION" \
            --body "Promove \`$DEV_BRANCH\` para \`$MAIN_BRANCH\`. Versão prevista: **$NEW_VERSION** (versionName + versionCode são incrementados juntos pelo \`release.yml\` no merge). Merge dispara \`release.yml\`: bump de versão, build, GitHub Release, gate manual, Google Play (rollout 10%) - \`sync-develop\` então mergeia \`$MAIN_BRANCH\` de volta em \`$DEV_BRANCH\`." \
            --base "$MAIN_BRANCH" \
            --head "$DEV_BRANCH" \
            --label "release"

      - name: ${{ steps.config.outputs.step_noop }}
        if: steps.bump.outputs.new_version == ''
        run: echo "::notice::Nenhum commit feat/fix/breaking desde a última release - nada para preparar."
