name: Release to Master

on:
  workflow_dispatch:

jobs:
  version_manager:
    name: Version Manager
    runs-on: ubuntu-latest
    outputs:
      new_name: ${{ steps.bump.outputs.new_name }}
      new_code: ${{ steps.bump.outputs.new_code }}
      updated: ${{ steps.bump.outputs.updated }}
      feat: ${{ steps.count_feat.outputs.feat }}
      fix: ${{ steps.count_fix.outputs.fix }}
      breaking: ${{ steps.count_breaking.outputs.breaking }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Config
        id: config
        run: |
          echo "main_branch=$(yq '.git.branches.main' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "dev_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_file=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Count commits
        id: counts
        run: |
          FEAT=$(git log origin/${{ steps.config.outputs.main_branch }}..origin/${{ steps.config.outputs.dev_branch }} --pretty=%s | grep -E '^feat' | wc -l || echo 0)
          FIX=$(git log origin/${{ steps.config.outputs.main_branch }}..origin/${{ steps.config.outputs.dev_branch }} --pretty=%s | grep -E '^(fix|revert|perf|refactor)' | wc -l || echo 0)
          BREAKING=$(git log origin/${{ steps.config.outputs.main_branch }}..origin/${{ steps.config.outputs.dev_branch }} --pretty=%b | grep -c 'BREAKING CHANGE' || echo 0)
          echo "feat=$FEAT" >> $GITHUB_OUTPUT
          echo "fix=$FIX" >> $GITHUB_OUTPUT
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      - name: Get current version
        id: version
        run: |
          FILE="${{ steps.config.outputs.gradle_file }}"
          VERSION_NAME=$(grep "versionName = " "$FILE" | sed 's/.*versionName = "\(.*\)"/\1/')
          VERSION_CODE=$(grep "versionCode = " "$FILE" | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          FEAT=${{ steps.counts.outputs.feat }}
          FIX=${{ steps.counts.outputs.fix }}
          BREAKING=${{ steps.counts.outputs.breaking }}
          VERSION=${{ steps.version.outputs.name }}
          CODE=${{ steps.version.outputs.code }}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          if [ $((FEAT + FIX + BREAKING)) -eq 0 ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            if [ $BREAKING -gt 0 ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [ $FEAT -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            echo "new_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
            echo "new_code=$((CODE + 1))" >> $GITHUB_OUTPUT
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

  update_version:
    needs: [version_manager]
    if: needs.version_manager.outputs.updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Version File
        run: |
          FILE=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)
          BOT_NAME=$(yq '.git.bot_name' .github/pipeline-config.yaml)
          BOT_EMAIL=$(yq '.git.bot_email' .github/pipeline-config.yaml)
          DEV_BRANCH=$(yq '.git.branches.develop' .github/pipeline-config.yaml)
          
          sed -i "s/versionCode = .*/versionCode = ${{ needs.version_manager.outputs.new_code }}/" "$FILE"
          sed -i "s/versionName = .*/versionName = \"${{ needs.version_manager.outputs.new_name }}\"/" "$FILE"
          
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add "$FILE"
          git commit -m "chore: bump version to ${{ needs.version_manager.outputs.new_name }}"
          git push origin $DEV_BRANCH

  pr_release:
    needs: [version_manager, update_version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
      
      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          MAIN_BRANCH=$(yq '.git.branches.main' .github/pipeline-config.yaml)
          DEV_BRANCH=$(yq '.git.branches.develop' .github/pipeline-config.yaml)
          RELEASE_BRANCH="release-$(date +'%Y-%m-%d')"
          
          git checkout -b $RELEASE_BRANCH
          git push origin $RELEASE_BRANCH
          
          gh pr create \
            --title "Release ${{ needs.version_manager.outputs.new_name }}" \
            --body "Automated release preparation." \
            --base $MAIN_BRANCH \
            --head $RELEASE_BRANCH
