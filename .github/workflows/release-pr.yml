name: Release - Prepare Release PR

# Git Flow "promote to master" step: bumps the version on develop itself
# (reviewable in the PR diff once opened) and opens a PR straight from
# develop into master - no intermediate release branch. release.yml (push to
# master) never bumps version itself, it only reads what already landed via
# this PR's merge, so master stays direct-push-free and every version change
# is a reviewable diff like any other change.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Bump & Open Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # develop is branch-protected (require PR) - the default GITHUB_TOKEN
      # this step would get without an explicit `token:` isn't an admin
      # identity and can't push directly even with enforce_admins: false,
      # unlike secrets.TOKEN (a real admin PAT). This job's whole mechanism
      # is a direct push to develop below, so this isn't optional.
      - name: 📥 Checkout develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}

      - name: Load Config
        id: config
        run: |
          echo "main_branch=$(yq '.git.branches.main' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "dev_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_name=$(yq '.git.bot_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_email=$(yq '.git.bot_email' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_bump_version=$(yq '.release.step_names.bump_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_commit_push_develop=$(yq '.release.step_names.commit_push_develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_open_pr=$(yq '.release.step_names.open_pr' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_noop=$(yq '.release.step_names.noop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: ${{ steps.config.outputs.step_bump_version }}
        id: bump
        run: |
          git config user.name "${{ steps.config.outputs.bot_name }}"
          git config user.email "${{ steps.config.outputs.bot_email }}"
          chmod +x .github/scripts/version.sh
          new_version=$(.github/scripts/version.sh)
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: ${{ steps.config.outputs.step_commit_push_develop }}
        if: steps.bump.outputs.new_version != ''
        run: |
          GRADLE_FILE=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)
          CHANGELOG_FILE=$(yq '.paths.changelog' .github/pipeline-config.yaml)
          git add "$GRADLE_FILE" "$CHANGELOG_FILE"
          git commit -m "chore(release): prepare ${{ steps.bump.outputs.new_version }}"
          git push origin "HEAD:${{ steps.config.outputs.dev_branch }}"

      - name: ${{ steps.config.outputs.step_open_pr }}
        if: steps.bump.outputs.new_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          MAIN_BRANCH="${{ steps.config.outputs.main_branch }}"
          DEV_BRANCH="${{ steps.config.outputs.dev_branch }}"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          EXISTING=$(gh pr list --head "$DEV_BRANCH" --base "$MAIN_BRANCH" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::Já existe um PR aberto de $DEV_BRANCH → $MAIN_BRANCH, reaproveitando."
            exit 0
          fi

          gh pr create \
            --title "Release $NEW_VERSION" \
            --body "Promove \`$DEV_BRANCH\` para \`$MAIN_BRANCH\`. Bump de versão para **$NEW_VERSION** já incluso e revisável neste diff. Merge dispara \`release.yml\`: build, GitHub Release, gate manual, Google Play (rollout 10%) - \`sync-develop\` então mergeia \`$MAIN_BRANCH\` de volta em \`$DEV_BRANCH\`." \
            --base "$MAIN_BRANCH" \
            --head "$DEV_BRANCH" \
            --label "release"

      - name: ${{ steps.config.outputs.step_noop }}
        if: steps.bump.outputs.new_version == ''
        run: echo "::notice::Nenhum commit feat/fix/breaking desde a última release - nada para preparar."
