name: Continuous Integration - Build & Distribute

on:
  push:
    branches: [ develop ]

# No cancel-in-progress here (unlike tests.yml): this workflow ends in a real
# Firebase App Distribution upload, so an in-flight run should finish or fail
# on its own rather than being killed mid-deploy by the next push - it just
# queues behind whatever's already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      java_distribution: ${{ steps.config.outputs.java_distribution }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      default_timeout: ${{ steps.config.outputs.default_timeout }}
      app_name: ${{ steps.config.outputs.app_name }}
      variants: ${{ steps.config.outputs.variants }}
      target_names: ${{ steps.config.outputs.target_names }}
      checks_stage_1: ${{ steps.config.outputs.checks_stage_1 }}
      checks_stage_2: ${{ steps.config.outputs.checks_stage_2 }}
      build_enabled: ${{ steps.config.outputs.build_enabled }}
      deploy_enabled: ${{ steps.config.outputs.deploy_enabled }}
      size_enabled: ${{ steps.config.outputs.size_enabled }}
      size_target: ${{ steps.config.outputs.size_target }}
      size_apk_glob: ${{ steps.config.outputs.size_apk_glob }}
      dev_branch: ${{ steps.config.outputs.dev_branch }}
      bot_name: ${{ steps.config.outputs.bot_name }}
      bot_email: ${{ steps.config.outputs.bot_email }}
      step_checkout: ${{ steps.config.outputs.step_checkout }}
      step_setup_env: ${{ steps.config.outputs.step_setup_env }}
      step_run_check: ${{ steps.config.outputs.step_run_check }}
      step_build_apks: ${{ steps.config.outputs.step_build_apks }}
      step_build_upload_apks: ${{ steps.config.outputs.step_build_upload_apks }}
      step_deploy_download_apks: ${{ steps.config.outputs.step_deploy_download_apks }}
      step_deploy_install_firebase_cli: ${{ steps.config.outputs.step_deploy_install_firebase_cli }}
      step_deploy_distribute: ${{ steps.config.outputs.step_deploy_distribute }}
      step_size_download_apks: ${{ steps.config.outputs.step_size_download_apks }}
      step_size_update_baseline: ${{ steps.config.outputs.step_size_update_baseline }}
    steps:
      # Bootstrap exception (see step_names comment in pipeline-config.yaml):
      # this step downloads the very file its own name would come from.
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Bootstrap exception too: runs before the config-loading step below,
      # so no step_names.* output exists yet at this point.
      - name: 🧪 Validate pipeline-config.yaml
        run: |
          chmod +x .github/scripts/validate-pipeline-config.sh
          .github/scripts/validate-pipeline-config.sh

      - id: config
        run: |
          echo "jdk_version=$(yq '.build."java-version"' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "java_distribution=$(yq '.build."java-distribution" // "temurin"' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.build.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "default_timeout=$(yq '.build.default_timeout_minutes' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "app_name=$(yq '.project.name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "variants=$(yq -o=json '[.build.targets[] as $t | $t.variants[] | select(.enabled) | . + {"target": $t.name, "module": $t.module}]' .github/pipeline-config.yaml | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "target_names=$(yq -o=json '[.build.targets[] | select([.variants[].enabled] | any) | .name]' .github/pipeline-config.yaml | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "checks_stage_1=$(yq -o=json '[.checks[] | select(.enabled) | select((.stage // 1) == 1)]' .github/pipeline-config.yaml | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "checks_stage_2=$(yq -o=json '[.checks[] | select(.enabled) | select((.stage // 1) == 2)]' .github/pipeline-config.yaml | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "build_enabled=true" >> $GITHUB_OUTPUT
          echo "deploy_enabled=$(yq '.release.firebase.enabled // false' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "size_enabled=$(yq '.size_check.enabled' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "size_target=$(yq '.size_check.target' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          SIZE_TARGET=$(yq '.size_check.target' .github/pipeline-config.yaml)
          export SIZE_TARGET
          SIZE_VARIANT=$(yq '.size_check.variant' .github/pipeline-config.yaml)
          export SIZE_VARIANT
          echo "size_apk_glob=$(yq '.build.targets[] | select(.name == strenv(SIZE_TARGET)) | .variants[] | select(.name == strenv(SIZE_VARIANT)) | .path' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "dev_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_name=$(yq '.git.bot_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_email=$(yq '.git.bot_email' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_checkout=$(yq '.build.step_names.checkout' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_setup_env=$(yq '.build.step_names.setup_environment' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_run_check=$(yq '.build.step_names.run_check' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_build_apks=$(yq '.build.step_names.build_apks' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_build_upload_apks=$(yq '.build.step_names.upload_apks' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_deploy_download_apks=$(yq '.release.firebase.step_names.download_apks' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_deploy_install_firebase_cli=$(yq '.release.firebase.step_names.install_cli' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_deploy_distribute=$(yq '.release.firebase.step_names.distribute' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_size_download_apks=$(yq '.size_check.step_names.download_apks' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "step_size_update_baseline=$(yq '.size_check.step_names.update_baseline' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

  checks_stage_1:
    needs: [prepare]
    if: needs.prepare.outputs.checks_stage_1 != '[]'
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.prepare.outputs.checks_stage_1) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.default_timeout) }}
    name: ${{ matrix.check.display_name }}
    steps:
      - name: ${{ needs.prepare.outputs.step_checkout }}
        uses: actions/checkout@v4

      - name: ${{ needs.prepare.outputs.step_setup_env }}
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: ${{ needs.prepare.outputs.step_run_check }}
        run: |
          chmod +x gradlew
          ${{ matrix.check.command }}
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  checks_stage_2:
    needs: [prepare, checks_stage_1]
    if: |
      always() &&
      needs.prepare.outputs.checks_stage_2 != '[]' &&
      (needs.checks_stage_1.result == 'success' || needs.checks_stage_1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.prepare.outputs.checks_stage_2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.default_timeout) }}
    name: ${{ matrix.check.display_name }}
    steps:
      - name: ${{ needs.prepare.outputs.step_checkout }}
        uses: actions/checkout@v4

      - name: ${{ needs.prepare.outputs.step_setup_env }}
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: ${{ needs.prepare.outputs.step_run_check }}
        run: |
          chmod +x gradlew
          ${{ matrix.check.command }}
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}

  build:
    needs: [prepare, checks_stage_1, checks_stage_2]
    if: |
      always() &&
      needs.prepare.outputs.build_enabled == 'true' &&
      (needs.checks_stage_1.result == 'success' || needs.checks_stage_1.result == 'skipped') &&
      (needs.checks_stage_2.result == 'success' || needs.checks_stage_2.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # Grouped by target (app, wear, ...), not by variant: every enabled
        # variant (debug, release, ...) for that target is built as steps
        # inside ONE job, via the bash loop below, instead of fanning out
        # into one job per target/variant combination. Keeps the job list to
        # one entry per target regardless of how many variants a target
        # declares.
        target_name: ${{ fromJson(needs.prepare.outputs.target_names) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.default_timeout) }}
    name: 📦 Build ${{ matrix.target_name }} (all variants)
    steps:
      - name: ${{ needs.prepare.outputs.step_checkout }}
        uses: actions/checkout@v4

      - name: ${{ needs.prepare.outputs.step_setup_env }}
        uses: ./.github/actions/setup-env
        with:
          jdk-version: ${{ needs.prepare.outputs.jdk_version }}
          java-distribution: ${{ needs.prepare.outputs.java_distribution }}
          dotenv: ${{ secrets.DOTENV || vars.DOTENV }}
          google-services-json: ${{ secrets.GOOGLE_SERVICE_JSON }}

      - name: ${{ needs.prepare.outputs.step_build_apks }}
        id: build
        run: |
          chmod +x gradlew
          PATHS=""
          while IFS= read -r VARIANT; do
            MODULE=$(echo "$VARIANT" | jq -r '.module')
            GRADLE_TASK=$(echo "$VARIANT" | jq -r '.gradle_task')
            PATH_GLOB=$(echo "$VARIANT" | jq -r '.path')
            echo "::group::Building $MODULE:$GRADLE_TASK"
            ./gradlew "$MODULE:$GRADLE_TASK"
            echo "::endgroup::"
            PATHS="$PATHS"$'\n'"$PATH_GLOB"
          done < <(echo '${{ needs.prepare.outputs.variants }}' | jq -c --arg t "${{ matrix.target_name }}" '.[] | select(.target == $t)')
          {
            echo 'apk_paths<<APK_PATHS_EOF'
            echo "$PATHS"
            echo 'APK_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GRADLE_OPTS: ${{ needs.prepare.outputs.gradle_opts }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: ${{ needs.prepare.outputs.step_build_upload_apks }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-${{ matrix.target_name }}
          path: ${{ steps.build.outputs.apk_paths }}

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        target_name: ${{ fromJson(needs.prepare.outputs.target_names) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.default_timeout) }}
    name: 🚀 Update ${{ matrix.target_name }} (all variants)
    steps:
      - name: ${{ needs.prepare.outputs.step_checkout }}
        uses: actions/checkout@v4

      - name: ${{ needs.prepare.outputs.step_deploy_download_apks }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-${{ matrix.target_name }}
          path: output/

      - name: ${{ needs.prepare.outputs.step_deploy_install_firebase_cli }}
        run: curl -sL https://firebase.tools | bash

      - name: ${{ needs.prepare.outputs.step_deploy_distribute }}
        run: |
          RAW_NOTES=$(yq '.release.firebase.release_notes // "release automatica"' .github/pipeline-config.yaml)

          # Create service account file from secret
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json

          while IFS= read -r VARIANT; do
            LABEL=$(echo "$VARIANT" | jq -r '.deploy.firebase.label')
            APP_ID=$(echo "$VARIANT" | jq -r '.deploy.firebase.app_id // empty')

            if [ -z "$APP_ID" ]; then
              # Fallback to secret if not defined in the target/variant
              APP_ID="${{ secrets.FIREBASE_APP_ID }}"
            fi

            if [ -z "$APP_ID" ]; then
              echo "No app_id resolved for $LABEL, skipping distribution"
              continue
            fi

            VARIANT_NAME=$(echo "$VARIANT" | jq -r '.name')
            APK_FILE=$(find output/ -iname "*${VARIANT_NAME}*.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find output/ -name "*.apk" | head -n 1)
            fi
            NOTES="[$LABEL] $RAW_NOTES"

            echo "::group::Distributing $LABEL"
            firebase appdistribution:distribute "$APK_FILE" \
              --app "$APP_ID" \
              --release-notes "$NOTES"
            echo "::endgroup::"
          done < <(echo '${{ needs.prepare.outputs.variants }}' | jq -c --arg t "${{ matrix.target_name }}" '.[] | select(.target == $t)')

  # Keeps size_check.baseline_bytes in pipeline-config.yaml (read by
  # tests.yml's apk-size-check job on every PR) equal to the size of the
  # debug APK actually built above, so PRs are always compared against what
  # really shipped to internal testers - not a stale, hand-maintained number.
  # develop has no branch protection (see branch protection rules), so this
  # bot commit can push directly instead of needing a PR.
  update-size-baseline:
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.outputs.size_enabled == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.default_timeout) }}
    name: 📏 Update APK Size Baseline
    steps:
      # develop is now branch-protected (require PR) - the default
      # GITHUB_TOKEN this step gets without an explicit `token:` isn't an
      # admin identity and can't push directly even with enforce_admins:
      # false, unlike secrets.TOKEN (a real admin PAT, same as
      # sync-develop's checkout in release.yml).
      - name: ${{ needs.prepare.outputs.step_checkout }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: ${{ needs.prepare.outputs.step_size_download_apks }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_name }}-${{ needs.prepare.outputs.size_target }}
          path: output/

      - name: ${{ needs.prepare.outputs.step_size_update_baseline }}
        run: |
          GLOB="${{ needs.prepare.outputs.size_apk_glob }}"
          APK_FILE=$(find output/ -iname "$(basename "$GLOB")" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::warning::Nenhum APK encontrado casando com $GLOB no artefato baixado - baseline não atualizado."
            exit 0
          fi

          NEW_BYTES=$(stat -c%s "$APK_FILE")
          CURRENT_BYTES=$(yq '.size_check.baseline_bytes' .github/pipeline-config.yaml)
          if [ "$NEW_BYTES" == "$CURRENT_BYTES" ]; then
            echo "Baseline já está em $NEW_BYTES bytes, nada para commitar."
            exit 0
          fi

          yq -i ".size_check.baseline_bytes = $NEW_BYTES" .github/pipeline-config.yaml
          git config user.name "${{ needs.prepare.outputs.bot_name }}"
          git config user.email "${{ needs.prepare.outputs.bot_email }}"
          git add .github/pipeline-config.yaml
          git commit -m "chore(ci): update APK size baseline to $NEW_BYTES bytes"
          git push origin "HEAD:${{ needs.prepare.outputs.dev_branch }}"
