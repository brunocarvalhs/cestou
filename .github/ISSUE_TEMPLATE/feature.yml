name: "🚀 Feature Request"
description: "Suggest a new idea or improvement"
labels: ["New Feature"]
body:
  - type: markdown
    attributes:
      value: |
        We are always looking for ways to make the application better!
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: What would you like to call this feature?
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: As a [type of user], I want [goal] so that [benefit].
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      description: Please describe the problem you're trying to solve.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design / Implementation Ideas
      description: Any thoughts on how this should look or work?
