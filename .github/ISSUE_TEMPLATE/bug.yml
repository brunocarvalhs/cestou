name: "🐞 Bug Report"
description: "Report a bug to help us improve the application"
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A brief and descriptive title for the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we trigger this bug?
      placeholder: |
        1. Open the app
        2. Go to 'Products'
        3. Tap on 'Add Product'
        4. Observe the crash
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      options:
        - Emulator (Pixel 6)
        - Physical Device (Samsung S23)
        - Physical Device (Other)
        - Firebase App Distribution
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g., 1.2.3 (45)
  - type: textarea
    id: logs
    attributes:
      label: Logcat Output
      description: Please paste any relevant logs here.
      render: shell
