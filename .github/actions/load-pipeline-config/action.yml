name: 'Load Pipeline Config'
description: 'Loads centralized environment variables from pipeline-config.yml'
runs:
  using: "composite"
  steps:
    - name: Load Environment Variables
      shell: bash
      run: |
        CONFIG_FILE=".github/pipeline-config.yml"
        if [ -f "$CONFIG_FILE" ]; then
          # Using yq (standard on GitHub runners) to parse the env block
          yq e '.env | to_entries | .[] | .key + "=" + (.value | tostring)' "$CONFIG_FILE" >> $GITHUB_ENV
          echo "✅ Pipeline configuration loaded into GITHUB_ENV"
        else
          echo "❌ Configuration file $CONFIG_FILE not found!"
          exit 1
        fi
