appId: br.com.brunocarvalhs.howmuch
name: Chat Flow
---
# Depends on: an already-authenticated session (see onboarding_flow.yaml / README).
# Does NOT use clearState (see home_flow.yaml for why).
- launchApp

- tapOn: "IA Chat"
- assertVisible: "IA Assistente"
- assertVisible: "Mensagem"
- assertVisible: "Configurações"

- tapOn: "Mensagem"
- inputText: "Oi"
- tapOn: "Enviar mensagem"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Oi"

- tapOn: "Listas"
- assertVisible: "Cestou"
