appId: br.com.brunocarvalhs.howmuch
name: Home Flow
---
# Depends on: an already-authenticated session (see onboarding_flow.yaml / README).
# Does NOT use clearState — clearing state logs the device out (Google Sign-In session
# is local), and this flow has no way to log back in without a human at the Google
# account picker. It also cannot assert a truly empty list state: a real, persisted
# account may already have lists from previous runs/fixtures (data syncs from
# Firestore, not just local storage).
#
# Selectors are testTag-based (id:), not display text, so this flow doesn't care which
# language the device/app is set to — see .maestro/README.md "Language / locale".
# "Cestou" is the one exception: app_name is identical across every values*/strings.xml
# in the repo (there's no translation to diverge from), so it's locale-safe as plain text.
- launchApp

- assertVisible: "Cestou"

# Bottom navigation tabs
- assertVisible:
    id: "nav_ShoppingList"
- assertVisible:
    id: "nav_AiChat"
- assertVisible:
    id: "nav_Profile"

# Join a list dialog, opened from the top bar icon
- tapOn:
    id: "join_list_icon"
- assertVisible:
    id: "join_list_dialog_title"
- assertVisible:
    id: "join_list_token_field"
- assertVisible:
    id: "join_list_scan_button"
- back

- assertVisible: "Cestou"
