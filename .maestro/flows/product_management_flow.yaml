appId: br.com.brunocarvalhs.howmuch
name: Product Management Flow
---
# Depends on: create_list_flow.yaml (uses the "value" list fixture). Does NOT use
# clearState (see home_flow.yaml for why).
- launchApp
- tapOn: "value"
- waitForAnimationToEnd:
    timeout: 2000

# Add product bottom sheet — opens on Quick Add by default instead of AI chat
# (Options.QUICK_ADD replaces Options.AI as the startDestination; item-add-authorship spec P3,
# PR5 / feat/iaa-quick-add). Quick Add shows a text field, common-product chips, and a
# scan/photo shortcut on one screen, no tab switching needed for a plain item.
- tapOn:
    point: 80%,88%
- assertVisible: "Nome do item"
- assertVisible: "Itens comuns"
- assertVisible: "Arroz"
# AI/Search/Photo/Suggestions stay reachable as secondary options via the header selector,
# unchanged in behavior (spec P3 AC3). Quick Add itself has no header chip — it's the landing
# surface, not a tab you switch back into.
- assertVisible: "Chat com IA"
- assertVisible: "Pesquisar"
- assertVisible: "Foto"
- assertVisible: "Sugestões"

- tapOn: "Pesquisar"
- assertVisible: "Produtos"
- assertVisible: "Receitas"
- assertVisible: "Buscar produto"
- tapOn: "Receitas"
- assertVisible: "Encontre receitas e adicione os ingredientes."
- assertVisible: "Também é possível utilizar IA para reconhecer automaticamente o conteúdo."

- tapOn: "Sugestões"
- tapOn: "Arroz"

# Product added to the list
- assertVisible: "Mercearia"
- assertVisible: "Marcar como comprado"
- assertVisible: "Arroz"
- assertVisible: "• Mercearia"
# NOTE (pre-existing drift, unrelated to PR5 / feat/iaa-quick-add — not fixed here per
# tasks.md T15): this "More options" -> Edit/Delete interaction does not match current
# ProductListItem.kt, where edit/delete live behind onLongClick + swipe-to-dismiss with no
# visible "More options" affordance. Left as-is rather than silently reworked.
- tapOn:
    text: "Mais opções"
    index: 1
- assertVisible: "Editar"
- assertVisible: "Excluir"

# Edit the product
- tapOn: "Editar"
- assertVisible: "Editar Produto"
- assertVisible: "Nome do Produto"
- assertVisible: "Categoria"
- assertVisible: "Preço Unitário"
- assertVisible: "Quantidade"
- tapOn: "Preço Unitário"
- inputText: "10000"
- assertVisible: "Salvar Alterações"
- tapOn: "Salvar Alterações"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn: "Voltar"
- assertVisible: "Cestou"
