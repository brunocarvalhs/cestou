appId: br.com.brunocarvalhs.howmuch
name: Join List Flow
---
# Only covers the local validation path (invalid/expired token).
# Joining a real list needs a token generated by another account/device,
# which is out of scope for a single-device Maestro flow.
- launchApp:
    clearState: true

- tapOn: "Join List"
- assertVisible: "Join a list"
- assertVisible: "Ask the list owner for the code or QR Code."
- assertVisible: "List code"
- tapOn: "List code"
- inputText: "AAAAAA"
- tapOn: "Join List"
- assertVisible: "Invalid or expired token"
- back
- assertVisible: "Cestou"
