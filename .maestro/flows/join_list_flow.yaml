appId: br.com.brunocarvalhs.howmuch
name: Join List Flow
---
# Only covers the local validation path (invalid/expired token).
# Joining a real list needs a token generated by another account/device,
# which is out of scope for a single-device Maestro flow.
# Does NOT use clearState (see home_flow.yaml for why).
#
# Selectors are testTag-based (id:), not display text — see .maestro/README.md
# "Language / locale". The one exception is the last assertion: it verifies the actual
# content of the validation error message, which is real content under test, not just
# structure. Run this flow via .maestro/scripts/run.sh (not `maestro test` directly) so
# JOIN_ERROR_TEXT is resolved from the device's real locale instead of a fixed language —
# see that script for how, and .maestro/README.md for the fallback if you can't use it.
- launchApp

- tapOn:
    id: "join_list_icon"
- assertVisible:
    id: "join_list_dialog_title"
- assertVisible:
    id: "join_list_token_field"
- tapOn:
    id: "join_list_token_field"
- inputText: "AAAAAA"
- tapOn:
    id: "join_list_submit_button"
- assertVisible: "${JOIN_ERROR_TEXT}"
- back
- assertVisible: "Cestou"
