appId: br.com.brunocarvalhs.howmuch
name: Settings Flow
---
# Depends on: an already-authenticated session (see onboarding_flow.yaml / README).
# Does NOT use clearState (see home_flow.yaml for why).
- launchApp

- tapOn: "Perfil"
- assertVisible: "Preferências de Notificação"
- assertVisible: "Tema, Moeda e Idioma"
- assertVisible: "Sobre o App"
- tapOn: "Tema, Moeda e Idioma"

- assertVisible: "Configurações"
- assertVisible: "Geral"
- assertVisible: "IA"
- assertVisible: "Compras"
- assertVisible: "Dados"
- assertVisible: "Notificações"
- assertVisible: "Suporte"
- assertVisible: "Sobre"
- assertVisible: "Tema"
- assertVisible: "Idioma"
- assertVisible: "Moeda"

- tapOn: "Tema"
- assertVisible: "Selecione o Tema"
- assertVisible: "Sistema"
- assertVisible: "Claro"
- assertVisible: "Escuro"
- back
- back

- assertVisible: "Preferências de Notificação"
- assertVisible: "Sair"
