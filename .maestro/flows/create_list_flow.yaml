appId: br.com.brunocarvalhs.howmuch
name: Create List Flow
---
# Depends on: an already-authenticated session (see onboarding_flow.yaml / README).
# Creates the "value" list fixture used by product_management_flow.yaml and
# finish_purchase_flow.yaml. Does NOT use clearState (see home_flow.yaml for why).
- launchApp

# Create-list FAB, tapped by its content description instead of a screen-percentage
# point — the old "77%,4%" coordinate targeted the top bar, but the actual create
# button is a FloatingActionButton (bottom-right), not a top-bar icon.
- tapOn: "Criar lista"
- assertVisible: "Nova Lista"
- assertVisible: "Dê um nome para sua nova lista de compras"
- assertVisible: "Título da Lista"
- assertVisible: "Descrição (Opcional)"
- assertVisible: "Cancelar"
- assertVisible: "Criar"
- tapOn: "Título da Lista"
- inputText: "value"
- tapOn: "Descrição (Opcional)"
- inputText: "value"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Criar"

- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "value"
- assertVisible: "Compartilhar lista"
- assertVisible: "Voltar"
- assertVisible: "0 de 0"
- assertVisible: "Sua lista está vazia"
- assertVisible: "Adicione produtos ou peça ajuda à IA!"
- tapOn: "Voltar"
- assertVisible: "Cestou"
